<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a211e">
<title>The next room</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<!-- Offline layout fallback; Bootstrap supplies the full responsive grid when available. -->
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}
.container{width:100%;max-width:1140px;margin-inline:auto;padding-inline:12px}
.row{display:flex;flex-wrap:wrap;margin-inline:-12px}.row>*{width:100%;min-width:0;padding-inline:12px}
.justify-content-center{justify-content:center}.text-center{text-align:center}
.px-3{padding-inline:1rem}.py-4{padding-block:1.5rem}.mb-0{margin-bottom:0}.mb-3{margin-bottom:1rem}.mt-4{margin-top:1.5rem}
.d-block{display:block}.mx-auto{margin-inline:auto}.w-100{width:100%}.img-fluid{max-width:100%;height:auto}.rounded-3{border-radius:.5rem}
@media(min-width:576px){.px-sm-4{padding-inline:1.5rem}}
@media(min-width:768px){.col-md-10{width:83.333333%}.py-md-5{padding-block:3rem}.mt-md-5{margin-top:3rem}}
@media(min-width:992px){.col-lg-8{width:66.666667%}}
</style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at top,#21483b,#0a211e 70%);color:#fff5dc;font:18px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.next-room h1{font:normal clamp(1.8rem,5vw,3rem)/1.15 Georgia,serif;color:#fff5dc;text-wrap:balance}
.next-room .eyebrow{font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;color:#e9c783}
.next-room p{color:#c2d1cb}
.next-room .intro{font-size:clamp(1rem,2.5vw,1.125rem);line-height:1.65}
</style>
</head>
<body>
<main class="container next-room text-center px-3 px-sm-4 py-4 py-md-5">
 <div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-8">
   <p class="eyebrow mb-3">✧ North Pole dispatch ✧</p>
   <h1 class="mb-3">The keys have been restored to their holsters!</h1>
   <p class="intro mb-0">The reindeer have been released to fall in formation at Santa’s sleigh! We’re one step closer to catching that mischievous elf and restoring order to the operations around here</p>
   <img class="img-fluid w-100 d-block mx-auto rounded-3 mt-4 mt-md-5" src="images/wanted-poster.png" alt="North Pole Workshop wanted poster for ELF-496, suspected of misplacing the eight magical keys and disrupting the Reindeer Stables. Return all eight keys to their magical holsters to release the reindeer for flight." width="1199" height="1312">
  </div>
 </div>
</main>
</body>
</html>
